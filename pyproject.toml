[project]
name = "mitauri"
version = "0.1.0"
description = "Personal AI assistant, powered by the Claude Code CLI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "discord.py>=2.5,<3",
    "aiohttp>=3.9,<4",
    "cryptography>=42",
    "fastembed>=0.5,<1",
    "faster-whisper>=1.1,<2",
    "numpy>=2",
    "piper-tts>=1.3,<2",
    "pychromecast>=14,<15",
    "pyserial>=3.5,<4",
    "mcp>=1.2,<2",
    "python-dotenv>=1",
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1",
    "bleak>=3,<4",
    "onnx-asr[cpu,hub]>=0.12,<0.13",
    "httpx>=0.27,<1",
]

[project.scripts]
mitauri = "mitauri.__main__:main"
mitauri-listener = "mitauri.listener:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitauri"]
